name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Скачивание репозитория
      uses: actions/checkout@v4

    - name: Распаковка ZIP-архива
      run: |
        unzip -o project.zip -d extracted
        # Переносим файлы проекта в корень, если внутри ZIP была общая папка
        if [ -f extracted/gradlew ]; then
          cp -r extracted/* .
        else
          cp -r extracted/*/* . 2>/dev/null || cp -r extracted/* .
        fi

    - name: Установка JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Выдача прав на выполнение gradlew
      run: chmod +x gradlew

    - name: Сборка Debug APK
      run: ./gradlew assembleDebug

    - name: Сохранение готового APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
